name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: CIA bauen
        continue-on-error: true
        run: |
          apt-get update && apt-get install -y python3 wget unzip
          python3 gen_assets.py
          wget -q https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool.zip -O bt.zip && unzip -oq bt.zip
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O mr.zip && unzip -oq mr.zip
          chmod +x makerom linux-x86_64/bannertool
          linux-x86_64/bannertool makebanner -i banner.png -a silence.wav -o banner.bnr
          linux-x86_64/bannertool makesmdh -s "Casino 3DS" -l "Roulette, Pferderennen, Gluecksrad" -p "Casino" -i icon.png -o icon.icn
          ./makerom -f cia -o casino3ds.cia -elf casino3ds.elf -rsf app.rsf -target t -exefslogo -icon icon.icn -banner banner.bnr
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Casino 3DS (latest)
          files: |
            casino3ds.3dsx
            casino3ds.cia
